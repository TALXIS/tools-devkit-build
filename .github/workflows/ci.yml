# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: ci

on:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  test:
    # Both operating systems: generated file names are case-sensitive on Linux, and the release is built on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: Test
        run: dotnet test tests/Dataverse/Tasks/TALXIS.DevKit.Build.Dataverse.Tasks.Tests.csproj
      - name: Pack
        run: dotnet pack TALXIS.DevKit.Build.slnx --configuration Release

  # Packs the SDK and builds the projects under tests/fixtures against it (tests/run.sh): Node
  # restore and build, Debug/Release propagation, output contract, Rush, external providers.
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm and yarn for the pnpm-pcf and external-provider fixtures; bun for the latter too.
      - name: Install pnpm and yarn
        run: npm install --global pnpm@10 yarn@1
      - uses: oven-sh/setup-bun@v2
      - name: Run fixtures
        run: tests/run.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-logs
          path: |
            tests/.work/logs
            tests/.work/pack.console
          retention-days: 7
