# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: ci

on:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  test:
    # Both operating systems: generated file names are case-sensitive on Linux, and the release is built on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: Test
        run: dotnet test tests/Dataverse/Tasks/TALXIS.DevKit.Build.Dataverse.Tasks.Tests.csproj
      - name: Pack
        run: dotnet pack TALXIS.DevKit.Build.slnx --configuration Release
